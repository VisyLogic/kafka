AWSTemplateFormatVersion: '2010-09-09'
Description: AWS-only EKS, private MSK, ECR and pod identity. Review costs before deployment.
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  PrivateSubnetIds: {Type: 'List<AWS::EC2::Subnet::Id>'}
  AdminCidr: {Type: String, Description: Your workstation public IP /32 or corporate CIDR for the EKS API}
  AdminPrincipalArn: {Type: String, Description: IAM role ARN authorized to administer this learning cluster}
  KubernetesVersion: {Type: String, Default: '1.34'}
  ArtifactBucketName: {Type: String}
Resources:
  Images:
    Type: AWS::ECR::Repository
    Properties: {RepositoryName: eventflow, ImageScanningConfiguration: {ScanOnPush: true}}
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: eks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonEKSClusterPolicy]
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: eventflow
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig: {AuthenticationMode: API_AND_CONFIG_MAP}
      ResourcesVpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: [!Ref AdminCidr]
  AdminAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref AdminPrincipalArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope: {Type: cluster}
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
  Nodes:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref Cluster
      NodeRole: !GetAtt NodeRole.Arn
      Subnets: !Ref PrivateSubnetIds
      InstanceTypes: [t3.large]
      ScalingConfig: {MinSize: 1, DesiredSize: 1, MaxSize: 3}
  PodIdentityAgent:
    Type: AWS::EKS::Addon
    DependsOn: Nodes
    Properties: {ClusterName: !Ref Cluster, AddonName: eks-pod-identity-agent}
  BrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kafka IAM over TLS only from EventFlow cluster nodes
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 9098, ToPort: 9098, SourceSecurityGroupId: !GetAtt Cluster.ClusterSecurityGroupId}
  Brokers:
    Type: AWS::MSK::Cluster
    Properties:
      ClusterName: eventflow-msk
      KafkaVersion: 3.9.x
      NumberOfBrokerNodes: 2
      BrokerNodeGroupInfo:
        InstanceType: kafka.m5.large
        ClientSubnets: !Ref PrivateSubnetIds
        SecurityGroups: [!Ref BrokerSecurityGroup]
        StorageInfo: {EBSStorageInfo: {VolumeSize: 100}}
      EncryptionInfo:
        EncryptionInTransit: {ClientBroker: TLS, InCluster: true}
      ClientAuthentication: {Sasl: {Iam: {Enabled: true}}, Unauthenticated: {Enabled: false}}
  PodRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: ['sts:AssumeRole', 'sts:TagSession']
      Policies:
        - PolicyName: EventFlowApplicationResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['kafka-cluster:Connect', 'kafka-cluster:DescribeCluster', 'kafka-cluster:WriteDataIdempotently']
                Resource: !Ref Brokers
              - Effect: Allow
                Action: ['kafka-cluster:CreateTopic', 'kafka-cluster:DescribeTopic', 'kafka-cluster:AlterTopic', 'kafka-cluster:ReadData', 'kafka-cluster:WriteData']
                Resource: !Sub arn:aws:kafka:${AWS::Region}:${AWS::AccountId}:topic/eventflow-msk/*/eventflow.*
              - Effect: Allow
                Action: ['kafka-cluster:DescribeGroup', 'kafka-cluster:AlterGroup']
                Resource: !Sub arn:aws:kafka:${AWS::Region}:${AWS::AccountId}:group/eventflow-msk/*/eventflow-*
              - Effect: Allow
                Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:UpdateItem', 'dynamodb:Query', 'dynamodb:TransactWriteItems']
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/eventflow-data
              - Effect: Allow
                Action: ['sqs:GetQueueUrl', 'sqs:SendMessage', 'sqs:ReceiveMessage', 'sqs:DeleteMessage', 'sqs:ChangeMessageVisibility']
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:eventflow-ingress
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource: !Sub arn:aws:s3:::${ArtifactBucketName}/*
              - Effect: Allow
                Action: ['states:StartExecution', 'states:DescribeExecution', 'states:GetExecutionHistory', 'states:GetActivityTask']
                Resource:
                  - !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:eventflow-*
                  - !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:eventflow-*:*
                  - !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:activity:eventflow-*
              - Effect: Allow
                Action: ['states:SendTaskSuccess', 'states:SendTaskFailure', 'states:SendTaskHeartbeat']
                Resource: '*'
  AppIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgent
    Properties: {ClusterName: !Ref Cluster, Namespace: eventflow, ServiceAccount: eventflow, RoleArn: !GetAtt PodRole.Arn}
Outputs:
  ClusterName: {Value: !Ref Cluster}
  BrokerArn: {Value: !Ref Brokers}
  ImageRepository: {Value: !GetAtt Images.RepositoryUri}
  PodRoleArn: {Value: !GetAtt PodRole.Arn}
